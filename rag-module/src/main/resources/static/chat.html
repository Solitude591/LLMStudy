<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="用于测试 RAG Module 同步与流式聊天接口的本地聊天页面">
    <title>RAG Studio · 知识问答工作台</title>
    <link rel="stylesheet" href="css/chat.css">
</head>
<body>
<!-- 整个页面采用“会话侧栏 + 对话主区域”的双栏结构。 -->
<div class="chat-app">
    <aside id="sidebar" class="sidebar" aria-label="会话列表">
        <div class="brand-row">
            <div class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                    <path d="M7 6.5h7.2a3.3 3.3 0 0 1 0 6.6H7m5.3 0 4.2 4.4M7 4v16"/>
                </svg>
            </div>
            <div>
                <strong>RAG Studio</strong>
                <span>Knowledge workspace</span>
            </div>
            <button id="closeSidebarButton" class="icon-button mobile-only" type="button"
                    aria-label="关闭会话栏">×</button>
        </div>

        <button id="newChatButton" class="new-chat-button" type="button">
            <span class="new-chat-icon" aria-hidden="true">＋</span>
            新建对话
            <span class="new-chat-shortcut" aria-hidden="true">N</span>
        </button>

        <label class="session-search">
            <span class="visually-hidden">搜索会话</span>
            <span aria-hidden="true">⌕</span>
            <input id="sessionSearchInput" type="search" placeholder="搜索数据库会话" autocomplete="off">
        </label>

        <div class="session-heading">
            <span>最近会话</span>
            <span id="sessionCount">0</span>
        </div>

        <!-- 会话列表和历史消息均从 MySQL 实时读取。 -->
        <nav id="sessionList" class="session-list" aria-label="最近会话"></nav>

        <div class="sidebar-settings">
            <div class="settings-title">
                <span>测试设置</span>
                <span id="connectionDot" class="connection-dot" aria-hidden="true"></span>
            </div>

            <label class="setting-field">
                <span>用户 ID</span>
                <input id="userIdInput" type="text" value="default" maxlength="64"
                       placeholder="default" autocomplete="off">
            </label>

            <fieldset class="mode-field">
                <legend>响应模式</legend>
                <div class="mode-switch">
                    <button class="mode-button is-active" type="button" data-mode="stream">流式</button>
                    <button class="mode-button" type="button" data-mode="sync">完整</button>
                </div>
            </fieldset>

            <p id="endpointLabel" class="endpoint-label">POST /chat/client/stream</p>
        </div>
    </aside>

    <div id="sidebarBackdrop" class="sidebar-backdrop" hidden></div>

    <main class="conversation-panel">
        <header class="conversation-header">
            <button id="openSidebarButton" class="icon-button mobile-only" type="button"
                    aria-label="打开会话栏">☰</button>

            <div class="conversation-identity">
                <h1 id="conversationTitle">新对话</h1>
                <button id="conversationIdButton" class="conversation-id" type="button"
                        title="点击复制会话 ID" disabled>
                    尚未创建会话
                </button>
            </div>

            <div class="header-actions">
                <div class="rag-mode-badge" title="自动识别意图并按需进入 RAG 流程">
                    <span class="rag-mode-icon" aria-hidden="true">✦</span>
                    <span>RAG 智能路由</span>
                </div>
                <div class="header-status">
                    <span id="requestStatus" class="status-label">准备就绪</span>
                    <span class="status-orb" aria-hidden="true"></span>
                </div>
            </div>
        </header>

        <!-- 消息区域使用 aria-live，让辅助技术可以感知新回复。 -->
        <section id="messageViewport" class="message-viewport" aria-live="polite">
            <div id="messageList" class="message-list"></div>
        </section>

        <section class="composer-section" aria-label="发送消息">
            <div id="errorBanner" class="error-banner" role="alert" hidden></div>

            <form id="composerForm" class="composer-form">
                <div class="composer-context" aria-hidden="true">
                    <span class="composer-context-icon">✦</span>
                    <span>智能路由 · 知识库增强</span>
                    <span class="composer-context-status">已就绪</span>
                </div>
                <textarea id="messageInput" rows="1" maxlength="12000"
                          placeholder="输入问题，Enter 发送，Shift + Enter 换行"
                          aria-label="聊天消息"></textarea>

                <div class="composer-actions">
                    <span id="characterCount" class="character-count">0 / 12000</span>
                    <button id="stopButton" class="stop-button" type="button" hidden>停止</button>
                    <button id="sendButton" class="send-button" type="submit" aria-label="发送消息">
                        <span>发送</span>
                        <span aria-hidden="true">↗</span>
                    </button>
                </div>
            </form>

            <p class="composer-hint">
                <span>回答可能存在误差，请结合原始资料判断</span>
                <span aria-hidden="true">·</span>
                <span>会话落库 MySQL</span>
            </p>
        </section>
    </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="js/chat.js" defer></script>
</body>
</html>
