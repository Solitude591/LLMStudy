spring:
  application:
    name: rag-module

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    # createDatabaseIfNotExist=true 会在数据库不存在时自动创建（账号需要有 CREATE 权限）
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:rag}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:rag}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  sql:
    init:
      # 每次启动都检查 schema.sql；其中使用 IF NOT EXISTS，不会覆盖已有表和数据
      mode: always
      schema-locations: classpath:schema.sql

  data:
    redis:
      # Sa-Token 登录态及 KNN 父分片缓存；Redis 不可用时认证接口返回 503。
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # 连接与读写超时
      timeout: ${REDIS_TIMEOUT:2s}

  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        model: ${CHAT_MODEL:deepseek-v4-flash}
        temperature: 0.7
        reasoning-effort: high
        extra-body:
          thinking:
            type: enabled

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:4173}

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  active-timeout: 1800
  is-read-header: true
  is-read-cookie: false
  is-read-body: false
  is-concurrent: true
  is-share: true

elasticsearch:
  host: ${ELASTICSEARCH_URI:http://localhost:9200}
  index-name: ${ELASTICSEARCH_VECTOR_INDEX:know-engine}
  base-url: ${EMBEDDING_BASE_URL}
  model-name: ${EMBEDDING_MODEL}
  api-key: ${EMBEDDING_API_KEY}
  dimensions: ${EMBEDDING_DIMENSIONS:1536}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.llmstudy.rag.entity
  configuration:
    # 开启下划线转驼峰，version_id → versionId、content_hash → contentHash 等
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME:rag}

vision:
  api-url: ${VISION_API_URL:}
  api-key: ${VISION_API_KEY:}
  model: ${VISION_MODEL:}
  timeout-seconds: ${VISION_TIMEOUT_SECONDS:60}
  max-tokens: ${VISION_MAX_TOKENS:300}
  temperature: ${VISION_TEMPERATURE:0.2}
  concurrency: ${VISION_CONCURRENCY:4}
  max-retries: ${VISION_MAX_RETRIES:2}

mineru:
  token: ${MINERU_TOKEN}
  max-wait-seconds: ${MINERU_MAX_WAIT_SECONDS:600}

rag:
  llm-log:
    # 默认写入 rag-module/logs；显式设置 RAG_LLM_LOG_PATH 时不再按模块定位
    path: ${RAG_LLM_LOG_PATH:}

  chat:
    # 每次请求最多加载的历史消息数
    history-limit: ${RAG_CHAT_HISTORY_LIMIT:20}
    # AI 标题生成完成前，临时标题保留的最大字符数
    initial-title-max-length: ${RAG_CHAT_INITIAL_TITLE_MAX_LENGTH:10}
    intent:
      # 意图识别可使用更轻量的模型；留空时复用主聊天模型
      model: ${INTENT_MODEL:}
    title-summary:
      # 标题生成使用的轻量模型；留空则沿用主对话模型
      model: ${TITLE_SUMMARY_MODEL:deepseek-v4-flash}
      # 生成标题的最大字符数，超过则截断
      max-title-length: ${TITLE_SUMMARY_MAX_LENGTH:20}

  compensation:
    # 补偿任务 cron 表达式，每 5 分钟扫描一次失败/卡死文档
    cron: "0 */5 * * * ?"
    # 单个文档最大自动重试次数，超过后停止自动补偿，等待人工处理
    max-retry-count: ${RAG_COMPENSATION_MAX_RETRY_COUNT:3}
    # 单轮最多补偿的文档数，防止一次性拉起大量失败文档
    batch-size: 10
    # 失败后的冷却时间，避免与原处理流程竞争
    retry-delay: 5m
    # 中间态（converting/splitting/vectoring）卡死判定阈值
    stale-timeout: 30m

  splitter:
    markdown:
      # 普通正文 child 最大 Unicode code point 数；图片/表格不受此限制
      chunk-size: ${RAG_MARKDOWN_CHUNK_SIZE:1000}
      # 仅作用于普通正文 child 的重叠 code point 数，必须小于 chunk-size
      chunk-overlap: ${RAG_MARKDOWN_CHUNK_OVERLAP:100}

  snowflake:
    # 雪花算法 workerId，多实例部署时需保证各实例唯一（0~1023）
    worker-id: ${RAG_SNOWFLAKE_WORKER_ID:1}

  reranker:
    # 模型不打入 JAR；默认读 rag-module/models/bge-reranker，
    # 部署时也可放在 JAR 同级目录，或通过环境变量指向其他外部路径。
    enabled: ${BGE_RERANKER_ENABLED:true}
    model-path: ${BGE_RERANKER_MODEL_PATH:./models/bge-reranker/model_quantized.onnx}
    tokenizer-path: ${BGE_RERANKER_TOKENIZER_PATH:./models/bge-reranker/tokenizer.json}
    # pair 分词最大长度与推理批次大小
    max-length: ${BGE_RERANKER_MAX_LENGTH:512}
    batch-size: ${BGE_RERANKER_BATCH_SIZE:4}
    # 低于该 sigmoid 分数的候选不注入 LLM 上下文
    min-score: ${BGE_RERANKER_MIN_SCORE:0.6}

  retrieval:
    per-query-top-k: ${RAG_RETRIEVAL_PER_QUERY_TOP_K:10}
    fusion-candidate-count: ${RAG_RETRIEVAL_FUSION_CANDIDATE_COUNT:40}
    rerank-candidate-count: ${RAG_RETRIEVAL_RERANK_CANDIDATE_COUNT:20}
    top-n: ${RAG_RETRIEVAL_TOP_N:5}
    rrf-k: ${RAG_RETRIEVAL_RRF_K:60}
    expansion-lane-weight: ${RAG_RETRIEVAL_EXPANSION_LANE_WEIGHT:0.5}
    focused-document-min-score: ${RAG_RETRIEVAL_FOCUSED_DOC_MIN_SCORE:0.2}
    section-merge-enabled: ${RAG_RETRIEVAL_SECTION_MERGE_ENABLED:true}
    section-merge-max-chars: ${RAG_RETRIEVAL_SECTION_MERGE_MAX_CHARS:4000}
    section-merge-max-chunks: ${RAG_RETRIEVAL_SECTION_MERGE_MAX_CHUNKS:4}
    bge-rank-weight: 0.85
    retrieval-rerank-weight: 0.15

logging:
  level:
    com.llmstudy.rag: DEBUG
    org.springframework.ai: DEBUG
