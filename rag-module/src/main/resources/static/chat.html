<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RAG 知识问答工作台">
    <title>RAG Studio</title>
    <link rel="stylesheet" href="css/chat.css">
</head>
<body>
<div class="app">
    <!-- 左侧会话栏 -->
    <aside id="sidebar" class="sidebar" aria-label="会话列表">
        <div class="sidebar-header">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">R</div>
                <span class="brand-name">RAG Studio</span>
            </div>
            <button id="closeSidebarButton" class="icon-button mobile-only" type="button"
                    aria-label="关闭会话栏">×</button>
        </div>

        <button id="newChatButton" class="new-chat-button" type="button">
            <span aria-hidden="true">+</span>
            新建对话
        </button>

        <div class="session-search">
            <input id="sessionSearchInput" type="search" placeholder="搜索会话" autocomplete="off">
        </div>

        <div class="session-list-header">
            <span>最近会话</span>
            <span id="sessionCount">0</span>
        </div>

        <nav id="sessionList" class="session-list" aria-label="最近会话"></nav>

        <div class="sidebar-footer">
            <div class="user-info">
                <span id="currentUserLabel">加载中…</span>
                <button id="logoutButton" type="button">退出</button>
            </div>
            <div class="mode-switch" role="group" aria-label="响应模式">
                <button class="mode-button is-active" type="button" data-mode="stream">流式</button>
                <button class="mode-button" type="button" data-mode="sync">完整</button>
            </div>
            <p id="endpointLabel" class="endpoint-label">POST /chat/client/stream</p>
        </div>
    </aside>

    <div id="sidebarBackdrop" class="backdrop" hidden></div>

    <!-- 主对话区 -->
    <main class="main">
        <header class="main-header">
            <button id="openSidebarButton" class="icon-button mobile-only" type="button"
                    aria-label="打开会话栏">☰</button>
            <div class="header-title">
                <h1 id="conversationTitle">新对话</h1>
                <button id="conversationIdButton" class="conversation-id" type="button"
                        title="点击复制会话 ID" disabled>未创建</button>
            </div>
            <div class="header-actions">
                <button id="openKnowledgeButton" class="header-button" type="button"
                        aria-controls="knowledgePanel" aria-expanded="false">
                    知识库 <span id="knowledgeHeaderCount" class="badge">0</span>
                </button>
                <span id="requestStatus" class="status-text">就绪</span>
                <span id="connectionDot" class="connection-dot" aria-hidden="true"></span>
            </div>
        </header>

        <section id="messageViewport" class="message-viewport" aria-live="polite">
            <div id="messageList" class="message-list"></div>
        </section>

        <section class="composer-section" aria-label="发送消息">
            <div id="errorBanner" class="error-banner" role="alert" hidden></div>
            <form id="composerForm" class="composer-form">
                <textarea id="messageInput" rows="1" maxlength="12000"
                          placeholder="输入问题，Enter 发送，Shift + Enter 换行"
                          aria-label="聊天消息"></textarea>
                <div class="composer-footer">
                    <span id="characterCount" class="character-count">0 / 12000</span>
                    <button id="stopButton" class="stop-button" type="button" hidden>停止</button>
                    <button id="sendButton" class="send-button" type="submit">发送</button>
                </div>
            </form>
            <p class="composer-hint">回答可能存在误差，请结合原始资料判断</p>
        </section>
    </main>

    <!-- 知识库面板（默认隐藏） -->
    <div id="knowledgeBackdrop" class="backdrop" hidden></div>
    <aside id="knowledgePanel" class="knowledge-panel" aria-label="知识库管理">
        <header class="panel-header">
            <h2>知识库</h2>
            <button id="closeKnowledgeButton" class="icon-button" type="button"
                    aria-label="关闭知识库面板">×</button>
        </header>

        <div class="panel-actions">
            <button id="uploadDocumentButton" class="primary-button" type="button">上传文档</button>
            <form id="attachDocumentForm" class="attach-form">
                <input id="attachDocumentId" type="text" maxlength="64"
                       placeholder="输入 docId 关联" autocomplete="off">
                <button type="submit">关联</button>
            </form>
        </div>

        <div class="panel-stats">
            <div><strong id="onlineDocumentCount">0</strong><span>已上线</span></div>
            <div><strong id="processingDocumentCount">0</strong><span>处理中</span></div>
            <div><strong id="trackedDocumentCount">0</strong><span>已关联</span></div>
        </div>

        <div id="knowledgeError" class="panel-error" role="alert" hidden></div>

        <input id="documentSearchInput" class="panel-search" type="search"
               placeholder="搜索文档" autocomplete="off">

        <div id="documentList" class="document-list" aria-live="polite"></div>

        <footer class="panel-footer">版本与发布状态实时读取服务端</footer>
    </aside>
</div>

<!-- 文档上传弹窗 -->
<dialog id="documentDialog" class="document-dialog" aria-labelledby="documentDialogTitle">
    <form id="documentUploadForm" method="dialog" novalidate>
        <header class="dialog-header">
            <h2 id="documentDialogTitle">上传新文档</h2>
            <p id="documentDialogDescription">创建逻辑文档并生成第一个物理版本</p>
            <button id="closeDocumentDialogButton" class="icon-button" type="button"
                    aria-label="关闭">×</button>
        </header>

        <div id="versionTarget" class="version-target" hidden>
            <span>目标文档</span>
            <strong id="versionTargetTitle"></strong>
            <code id="versionTargetId"></code>
        </div>

        <label id="documentTitleField" class="form-field">
            <span>文档标题 <small>可选</small></span>
            <input id="documentTitleInput" name="docTitle" type="text" maxlength="255"
                   placeholder="不填写时使用文件名" autocomplete="off">
        </label>

        <label id="documentVisibilityField" class="form-field">
            <span>可见范围</span>
            <select id="documentVisibilityInput" name="visibility">
                <option value="PRIVATE">私有</option>
                <option value="ORGANIZATION">组织</option>
                <option value="PUBLIC">公开</option>
            </select>
        </label>

        <label id="changeSummaryField" class="form-field" hidden>
            <span>版本说明 <small>可选</small></span>
            <textarea id="changeSummaryInput" name="changeSummary" rows="3" maxlength="500"
                      placeholder="例如：更新产品参数与常见问题"></textarea>
        </label>

        <label id="documentDropzone" class="dropzone" for="documentFileInput">
            <input id="documentFileInput" name="file" type="file" accept=".pdf,.doc,.docx" required>
            <strong id="documentFileLabel">选择 PDF、DOC 或 DOCX 文件</strong>
            <span id="documentFileHint">点击选择，或将文件拖放到此处</span>
        </label>

        <p class="visibility-note">组织文档仅同组织成员可读，公开文档对所有已登录用户可读</p>
        <div id="documentFormError" class="form-error" role="alert" hidden></div>

        <footer class="dialog-actions">
            <button id="cancelDocumentDialogButton" class="secondary-button" type="button">取消</button>
            <button id="submitDocumentButton" class="primary-button" type="submit">开始上传</button>
        </footer>
    </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="js/auth.js" defer></script>
<script src="js/chat.js" defer></script>
</body>
</html>
